name: Security Scope Check

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: xlb_root_password
          MYSQL_DATABASE: xlb_local
          MYSQL_USER: xlb
          MYSQL_PASSWORD: xlb_local_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uxlb -pxlb_local_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
          --health-start-period=30s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: xlb_local
      MYSQL_USER: xlb
      MYSQL_PASSWORD: xlb_local_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: security-ci-test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        working-directory: backend
        run: pnpm exec tsx src/dal/migrateCli.ts

      - name: Seed database
        working-directory: backend
        run: pnpm exec tsx src/dal/seedCli.ts

      - name: Security tests
        run: pnpm test:security
