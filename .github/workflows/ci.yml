name: CI

permissions:
  contents: read

concurrency:
  group: engineering-rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engineering_rc:
    name: Engineering RC (non-TKE)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: xlb_root_password
          MYSQL_DATABASE: xlb_local
          MYSQL_USER: xlb
          MYSQL_PASSWORD: xlb_local_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uxlb -pxlb_local_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: xlb_local
      MYSQL_USER: xlb
      MYSQL_PASSWORD: xlb_local_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      XLB_STAGE2C3_REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Bind reliability drills to CI service containers
        shell: bash
        run: |
          mysql_container="$(docker ps --filter 'ancestor=mysql:8' --format '{{.ID}}' | head -n 1)"
          redis_container="$(docker ps --filter 'ancestor=redis:7' --format '{{.ID}}' | head -n 1)"
          test -n "$mysql_container"
          test -n "$redis_container"
          echo "XLB_STAGE4A_MYSQL_CONTAINER=$mysql_container" >> "$GITHUB_ENV"
          echo "XLB_STAGE4A_REDIS_CONTAINER=$redis_container" >> "$GITHUB_ENV"

      - name: Canonical non-TKE engineering RC
        run: pnpm gate:engineering-rc

      - name: Upload engineering RC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-rc-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .artifacts/engineering-rc/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Engineering RC provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: engineering_rc
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download successful engineering RC evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-rc-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .attestation-input

      - name: Attest engineering RC manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: .attestation-input/**/manifest.json
