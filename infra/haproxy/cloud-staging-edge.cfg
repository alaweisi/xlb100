global
  log stdout format raw local0

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend xlb_http_or_tls_on_port_80
  bind :80
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend xlb_tls if { req.ssl_hello_type 1 }
  default_backend xlb_http

frontend xlb_tls_on_port_443
  bind :443
  default_backend xlb_tls

backend xlb_http
  server reverse_proxy reverse-proxy:80 check

backend xlb_tls
  server reverse_proxy_tls reverse-proxy:443 check
