server {
  listen 80;
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/123.207.198.136/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/123.207.198.136/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:XLB_STAGING_TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    proxy_pass http://backend:3000/health;
  }

  location /api/ {
    proxy_pass http://backend:3000;
  }

  location = /api/oa/events {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
  }

  location = /api/support/realtime {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_buffering off;
  }

  location = / {
    return 302 /customer/;
  }

  location /customer/assets/ {
    proxy_pass http://customer:4173/assets/;
  }

  location /customer/ {
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '="/assets/' '="/customer/assets/';
    sub_filter "='/assets/" "='/customer/assets/";
    proxy_pass http://customer:4173/;
  }

  location /worker/assets/ {
    proxy_pass http://worker:4173/assets/;
  }

  location /worker/ {
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '="/assets/' '="/worker/assets/';
    sub_filter "='/assets/" "='/worker/assets/";
    proxy_pass http://worker:4173/;
  }

  location /admin/assets/ {
    proxy_pass http://admin:4173/assets/;
  }

  location /admin/ {
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '="/assets/' '="/admin/assets/';
    sub_filter "='/assets/" "='/admin/assets/";
    proxy_pass http://admin:4173/;
  }

  location /oa/assets/ {
    proxy_pass http://oa:4173/assets/;
  }

  location /oa/ {
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '="/assets/' '="/oa/assets/';
    sub_filter "='/assets/" "='/oa/assets/";
    proxy_pass http://oa:4173/;
  }

  location = /oa {
    return 301 /oa/;
  }

  location /dashboard/assets/ {
    proxy_pass http://dashboard:4173/assets/;
  }

  location /dashboard/ {
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '="/assets/' '="/dashboard/assets/';
    sub_filter "='/assets/" "='/dashboard/assets/";
    proxy_pass http://dashboard:4173/;
  }

  location = /dashboard {
    return 301 /dashboard/;
  }
}
